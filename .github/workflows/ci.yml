name: ci

# Build, lint and test on every push and pull request, on GitHub's runners:
#  - gofmt, go vet and staticcheck
#  - the conformance vectors (the vectors submodule), the examples and the unit tests
#  - the oldest Go the module supports (go.mod), and the current one
#  - arm64, where Go fuses multiply-add (FMA)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', 'stable']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-clean: $unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: The vectors ran
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -run 'TestVectors$' -v . | tee vectors.log | grep -E 'cases,|^--- '
          cases=$(grep -oE '[0-9]+ cases, [0-9]+ checks' vectors.log | cut -d' ' -f1)
          if [ -z "$cases" ] || [ "$cases" -eq 0 ]; then echo "::error::the vectors suite ran no cases"; exit 1; fi
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  arm64:
    name: test (arm64)
    # Catches arithmetic that differs where the compiler fuses multiply-add (FMA), which amd64
    # does not do by default and arm64 does.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test -count=1 ./...
      - name: The vectors ran
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -run 'TestVectors$' -v . | tee vectors.log | grep -E 'cases,|^--- '
          cases=$(grep -oE '[0-9]+ cases, [0-9]+ checks' vectors.log | cut -d' ' -f1)
          if [ -z "$cases" ] || [ "$cases" -eq 0 ]; then echo "::error::the vectors suite ran no cases"; exit 1; fi
